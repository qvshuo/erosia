services:
  erosia:
    image: erosia:1.1.0
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:9307:9307"
    volumes:
      - /path/to/library:/media:ro # 改为视频、STRM 所在的实际目录
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    depends_on:
      flaresolverr:
        condition: service_healthy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/flaresolverr:/config
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8191/
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    profiles: [dev]
    build:
      context: .
      target: frontend
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./erosia/web:/build:ro
      - /build/node_modules
    depends_on:
      - erosia
